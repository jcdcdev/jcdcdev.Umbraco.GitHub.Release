name: "🚀 Release Umbraco Package"
description: "Create and publish a new release of an Umbraco package to NuGet."
author: "James Carter"
branding:
  icon: "refresh-cw"
  color: "gray-dark"
inputs:
  artifact-name:
    description: "Artifact name"
    required: true
  version:
    description: "Version"
    required: true
  nuget-api-key:
    description: "NuGet API key"
    required: false
  github-token:
    description: "GitHub token"
    required: true
  nuget-source:
    description: "NuGet source"
    default: "https://api.nuget.org/v3/index.json"
    required: false
  nuget-skip-push:
    description: "Skip NuGet push"
    default: "false"
    required: false
  ignore-files:
    description: "Skip release if only these files are changed (supports wildcards, e.g. docs/**, .github/workflows/*.yml)"
    default: "SECURITY.md,.github/README.md,docs/**,.github/workflows/*.yml,GitVersion.yml"
    required: false
  strict-umbraco-version:
    description: "Fails the build if the computed Input Major Version does not match this Action's Major version - Used to ensure builds are deterministic for Umbraco releases."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Check Umbraco Version
      id: check-umbraco-version
      shell: bash
      if: ${{ inputs.strict-umbraco-version == 'true' }}
      run: |

        MAJOR_VERSION=$(echo "${{ inputs.version }}" | cut -d. -f1)
        UMBRACO_VERSION="18"
        if [ "$MAJOR_VERSION" != "$UMBRACO_VERSION" ]; then
          echo "Umbraco version mismatch - expected $UMBRACO_VERSION but got $MAJOR_VERSION"
          echo "Check the branch you are building from is correct, GitVersion.yml is configured correctly and that you are using the correct version of this Action for the Umbraco version you are building."
          exit 1
        fi
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Check for changes
      id: check-changes
      shell: bash
      run: |
        IGNORE_FILES="${{ inputs.ignore-files }}"
        CURRENT_BRANCH=$(git symbolic-ref --short HEAD 2>&1)
        TAGS=$(git for-each-ref --sort=creatordate --format '%(refname:short)' refs/tags)
        MERGED_TAGS=($(git tag --merged "$CURRENT_BRANCH" --sort=creatordate))

        echo "Current branch: $CURRENT_BRANCH"
        if [[ "$CURRENT_BRANCH" == *"/dev" ]]; then
          ALLOW_PRERELEASE=true
        else
          ALLOW_PRERELEASE=false
        fi
        echo "Tags on current branch: ${MERGED_TAGS[*]}"

        # Find last release tag (skip pre-release tags unless allowed)
        LAST_TAG=""
        for (( idx=${#MERGED_TAGS[@]}-1 ; idx>=0 ; idx-- )); do
          TAG="${MERGED_TAGS[$idx]}"
          if [[ "$TAG" == *-* && "$ALLOW_PRERELEASE" == "false" ]]; then
            echo "Skipping pre-release tag: $TAG"
            continue
          fi
          LAST_TAG="$TAG"
          echo "Last release tag found: $LAST_TAG"
          break
        done

        if [[ -z "$LAST_TAG" ]]; then
          echo "No release tags found on current branch, skipping release."
          exit 1
        fi

        # List all changed files since the last release tag
        CHANGED_FILES=$(git diff --name-only "$LAST_TAG...$CURRENT_BRANCH")
        echo -e "Changed files since last tag:\n\n$CHANGED_FILES\n\n"
        IGNORE_RELEASE=true

        if [[ -z "$CHANGED_FILES" ]]; then
          echo "No changed files found since last tag, skipping release."
          exit 1
        fi

        # Convert ignore patterns to array
        IFS=',' read -ra IGNORE_PATTERNS <<< "$IGNORE_FILES"

        for FILE in $CHANGED_FILES; do
          IGNORED=false
          for PATTERN in "${IGNORE_PATTERNS[@]}"; do
            PATTERN_TRIMMED=$(echo "$PATTERN" | xargs)
            # Use bash extended globbing for ** and *
            if [[ "$FILE" == $PATTERN_TRIMMED ]]; then
              echo "Ignoring file: $FILE (matches pattern: $PATTERN_TRIMMED)"
              IGNORED=true
              break
            fi
            # Fallback: try glob match
            shopt -s globstar nullglob
            if [[ "$FILE" == $PATTERN_TRIMMED ]]; then
              echo "Ignoring file: $FILE (matches pattern: $PATTERN_TRIMMED)"
              IGNORED=true
              break
            fi
          done
          if ! $IGNORED; then
            echo "Relevant change found: $FILE"
            IGNORE_RELEASE=false
            break
          fi
        done

        echo "SKIP=$IGNORE_RELEASE"
        echo "SKIP=$IGNORE_RELEASE" >> $GITHUB_ENV

    - name: Remove all labels from PR
      if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.number }}
        PR_TITLE: "${{ inputs.version }}"
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "No PR number found, skipping label removal."
          exit 0
        fi

        args=("edit" "--title" "$PR_TITLE" "$PR_NUMBER")

        mapfile -t labels < <(gh pr view "$PR_NUMBER" --json labels | jq -r '.labels[].name')

        for label in "${labels[@]}"; do
          args+=("--remove-label" "$label")
        done

        gh pr "${args[@]}"
    - name: Update PR if release is skipped
      if: ${{ (env.SKIP == 'true') && (github.event_name == 'pull_request') && (github.event.action == 'closed') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.number }}
        PR_TITLE: "${{ inputs.version }} (release skipped)"
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "No PR number found, skipping title update."
          exit 0
        fi

        gh label create "⚠️ release skipped" --color FFA500 --description "Indicates that the release was skipped due to only ignored files being changed." || echo "Label already exists, skipping creation."
        gh pr edit $PR_NUMBER --title "$PR_TITLE" --add-label "⚠️ release skipped"
    - name: Update PR if release is not skipped
      if: ${{ (env.SKIP == 'false') && (github.event_name == 'pull_request') && (github.event.action == 'closed') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.number }}
        PR_TITLE: "${{ inputs.version }} (released)"
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "No PR number found, skipping title update."
          exit 0
        fi

        gh label create "✅ released" --color 0E8A16 --description "Indicates that the release has been successfully published." || echo "Label already exists, skipping creation."
        gh pr edit $PR_NUMBER --title "$PR_TITLE" --add-label "✅ released"
    - name: Set env
      if: ${{ env.SKIP == 'false' }}
      id: set-env
      shell: bash
      run: |
        echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
        echo "ARTIFACT_NAME=${{ inputs.artifact-name }}" >> $GITHUB_ENV
        echo "NUGET_API_KEY=${{ inputs.nuget-api-key }}" >> $GITHUB_ENV
        echo "ARTIFACT_PATH=./packages" >> $GITHUB_ENV
        echo "NUGET_SOURCE=${{ inputs.nuget-source }}" >> $GITHUB_ENV
    - name: Download package
      if: ${{ env.SKIP == 'false' }}
      uses: actions/download-artifact@v6
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_PATH }}
    - name: Push to NuGet
      if: ${{ (inputs.nuget-skip-push != 'true') && (env.SKIP == 'false') }}
      shell: bash
      run: |
        dotnet nuget push ${{ env.ARTIFACT_PATH }}/**/*.nupkg -k ${{ env.NUGET_API_KEY }} -s ${{ env.NUGET_SOURCE }} --skip-duplicate
    - name: 🚀 Create release
      if: ${{ env.SKIP == 'false' }}
      uses: jcdcdev/jcdcdev.GitHub.CreateRelease@main
      with:
        version: ${{ env.VERSION }}
        github-token: ${{ inputs.github-token }}
